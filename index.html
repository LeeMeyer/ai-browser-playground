<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local AI Agent + LiveCodes Playground</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="playground-pane">
        <header class="pane-header">
          <h1>LiveCodes + Local AI Agent</h1>
          <p>Ask the agent to inspect or change the code in the embedded playground.</p>
        </header>
        <div id="playground"></div>
      </section>

      <aside class="chat-pane" aria-label="Agent chat">
        <div class="chat-header">
          <h2>Agent</h2>
          <div class="model-controls">
            <select id="provider" aria-label="AI provider">
              <option value="chrome" selected>Chrome built-in AI</option>
              <option value="transformers">Transformers.js</option>
            </select>
            <div id="model-field" class="model-field" hidden>
              <select id="model-preset" aria-label="Model preset">
                <option value="gemma4e2bitonnx" selected>Gemma 4 E2B IT (ONNX)</option>
                <option value="gemma4e4bitonnx">Gemma 4 E4B IT (ONNX)</option>
              </select>
            </div>
            <button id="init-ai" type="button">Initialize AI</button>
          </div>
        </div>

        <div id="status" class="status">Chrome built-in AI not initialized.</div>
        <div id="model-load" class="model-load" hidden>
          <div class="model-load-bar" aria-hidden="true">
            <div id="model-load-fill" class="model-load-fill"></div>
          </div>
          <div id="model-load-text" class="model-load-text">Loading model...</div>
        </div>
        <div id="thinking" class="thinking" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>Agent is thinking...</span>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <textarea
            id="prompt"
            rows="4"
            placeholder="Example: Make the button rounded and change text to 'Launch'."
            disabled
            required
          ></textarea>
          <button id="send" type="submit" disabled>Send</button>
        </form>
      </aside>
    </main>

    <script type="module" src="./app.js?v=20260903-34"></script>
  </body>
</html>
